name: Build web app
description: Install dependencies and build the production web application
inputs:
  script:
    description: npm script that builds the web app (build, build:native-free or build:native-paid)
    default: build
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Build web app
      shell: bash
      env:
        BUILD_SCRIPT: ${{ inputs.script }}
      run: npm run "$BUILD_SCRIPT"
