name: ios-compile

# Unsigned simulator build of the iOS shell on a macOS runner (PIP-004). It is the only check of the Swift code, which nobody can
# build locally (M18). No Apple account, no secrets, no signing. Triggered like android and deploy-web: after a successful
# lint-test, on every branch for now; remove '**' and enable `- main` to build only the main branch (macOS minutes count 10x on a
# private repository). A workflow_run workflow only fires once this file is on the default branch.

on:
  workflow_run:
    workflows:
      - lint-test
    types:
      - completed
    branches:
      # - main
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-compile:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Build web app
        uses: ./.github/actions/build-web

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build for the simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log

      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          retention-days: 7
          if-no-files-found: ignore
