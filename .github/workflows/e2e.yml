name: e2e

# End-to-end tests (Playwright): the whole suite on the three desktop engines, the @smoke subset (open, navigate, draw, save as a new file)
# on every phone and tablet profile (PLT-011). Temporarily optional: this workflow is not
# referenced by deploy-web or android, so a red run here never blocks a deployment or an APK (PIP-001, DEC-100).
#
# Triggers (PIP-012): pull requests to `main`, tags `v*` and manual runs; not every branch push (lint-test covers those).
#
# Designed for a free GitHub account: no artifacts (the storage quota is small and cannot be raised) and no uploads of
# reports; every matrix job builds for itself, which takes seconds, and failures are read from the job log.
#
# To make the tests blocking again, move the `e2e` and `perf` jobs (with `needs: lint-test`) into lint-test.yml: workflow_run fires
# per workflow, so a separate workflow can never gate another one.

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run obsolete.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 90 }}
    strategy:
      # One Playwright project per job, all in parallel. `dev` is set only where the specs need the development build
      # (window.__cm debug hook: e2e/resource.spec.ts, the dev section of e2e/detection-bars.spec.ts and the detection suite e2e/detection-corpus.spec.ts,
      # which runs every reviewed `detection` entry once per profile on each engine of its `engines` list).
      # `timeout` (minutes) is the time cap of the three desktop engine jobs, twice the time measured locally for the detection suite (V2-M3b S1,
      # rounded up to 5 minutes); the phone and tablet jobs keep the default of 90.
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, dev: '1', timeout: 35 }
          - { project: chromium-pixel-phone, browser: chromium, dev: '0', grep: '@smoke' }
          - { project: chromium-small-phone, browser: chromium, dev: '0', grep: '@smoke' }
          - { project: chromium-galaxy-tablet, browser: chromium, dev: '0', grep: '@smoke' }
          - { project: firefox, browser: firefox, dev: '1', timeout: 15 }
          - { project: firefox-pixel-phone, browser: firefox, dev: '0', grep: '@smoke' }
          - { project: firefox-small-phone, browser: firefox, dev: '0', grep: '@smoke' }
          - { project: firefox-galaxy-tablet, browser: firefox, dev: '0', grep: '@smoke' }
          - { project: webkit, browser: webkit, dev: '1', workers: '1', timeout: 30 }
          - { project: webkit-iphone, browser: webkit, dev: '0', grep: '@smoke' }
          - { project: webkit-ipad, browser: webkit, dev: '0', grep: '@smoke' }
    env:
      E2E_DEV_BUILD: ${{ matrix.dev }}
      # V2-M3 S2: the specs of saving, restoring and persisted settings run against the paid edition (the web build is the free one).
      E2E_PAID_BUILD: '1'
      # WebKit uses about 5 GB per worker on the corpus and drawing specs; two workers exhaust the 16 GB runner and detection stalls. Empty = the default of playwright.config.ts.
      E2E_WORKERS: ${{ matrix.workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install qpdf (checks the PDFs the saving tests download)
        run: sudo apt-get install -y qpdf

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Production build
        run: npm run build

      - name: Paid edition build
        run: npm run build:native-paid -- --output-path dist/codexmusicae-paid

      # The development build is the paid edition too: the saving specs that use its debug hook need saving switched on.
      - name: Development build
        if: ${{ matrix.dev == '1' }}
        run: npm run build -- --configuration development,native-paid --output-path dist/codexmusicae-dev

      # TST-011: the PDFs of e2e/corpus/urls.txt; a failed download or a changed checksum is a warning, the entry is skipped.
      - name: Fetch the corpus PDFs
        run: node scripts/corpus.mjs --no-expected

      # CI=true (set by GitHub) makes playwright.config.ts serve the builds above, retry twice and use two workers.
      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.project }} ${{ matrix.grep && format('--grep {0}', matrix.grep) || '' }}

  # TST-008, TST-025, TST-026: the performance budgets of T:budgets and the load suite (detection and navigation in parallel, cache, canvas and
  # task invariants) on the real PDFs of the corpus (Chromium only, no retries). Runs after the e2e matrix (also when it failed). A breach fails
  # this job and every measured value is a row of its job summary; deploy-web and android do not depend on this workflow, so a red run never
  # blocks a deployment or an APK.
  perf:
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ !cancelled() }}
    timeout-minutes: 90
    env:
      PERF: '1'
      E2E_DEV_BUILD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # TST-011, TST-015: the performance tests use the largest real PDF and the one with the most pages.
      - name: Fetch the corpus PDFs
        run: node scripts/corpus.mjs --no-expected

      - name: Production build
        run: npm run build

      - name: Development build (debug hook for the memory test and the load suite)
        run: npm run build -- --configuration development,native-paid --output-path dist/codexmusicae-dev

      - name: Performance tests
        run: npx playwright test --project=perf
