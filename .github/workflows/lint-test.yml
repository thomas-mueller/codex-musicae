name: lint-test

on:
  push:
    tags-ignore:
      - '**'

permissions:
  contents: read

# The end-to-end tests run in their own workflow (e2e.yml) so that deploy-web and android, which wait for this one,
# never depend on them (PIP-001, DEC-100).
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint self-test
        run: npm run lint:selftest

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build
