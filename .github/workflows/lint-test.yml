name: lint-test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# The end-to-end tests run in their own workflow (e2e.yml) so that deploy-web and android, which wait for this one,
# never depend on them (PIP-001, DEC-100).
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install qpdf (checks every PDF the writer specs produce)
        run: sudo apt-get install -y qpdf

      - name: Lint
        run: npm run lint

      - name: Lint self-test
        run: npm run lint:selftest

      # Coverage is information only: no threshold fails the build (PIP-017).
      - name: Unit tests
        run: npm test -- --watch=false --coverage

      - name: Coverage per kind of test
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.md
          retention-days: 14

      - name: Production build
        run: npm run build

      - name: Version and build output check
        run: node scripts/check-versions.mjs --built

      # EDN-013, GEN-011: each native build starts from features.native.ts, the web build from features.web.ts.
      - name: Edition builds and consistency check
        run: |
          node scripts/check-editions.mjs --built dist/codexmusicae/browser web
          for edition in free paid; do
            npm run "build:native-$edition" -- --output-path "dist/native-$edition"
            node scripts/check-editions.mjs --built "dist/native-$edition/browser" native
          done
