<main class="pdf-editor">
  <header class="toolbar" aria-label="PDF controls">
    <div class="page-controls">
      <button type="button" (click)="previousPage()" [disabled]="!canGoToPreviousPage">
        Previous
      </button>
      <span aria-live="polite">Page {{ currentPage }} of {{ pageCount || '—' }}</span>
      <button type="button" (click)="nextPage()" [disabled]="!canGoToNextPage">
        Next
      </button>
    </div>

    <div class="view-controls">
      <button type="button" (click)="zoomOut()" [disabled]="zoom <= 0.5" aria-label="Zoom out">
        −
      </button>
      <span>{{ (zoom * 100) | number: '1.0-0' }}%</span>
      <button type="button" (click)="zoomIn()" [disabled]="zoom >= 3" aria-label="Zoom in">
        +
      </button>
      <button type="button" class="slides-button" (click)="navigateToViewer()">
        Slides viewer
      </button>
    </div>
  </header>

  <section #pdfViewport class="pdf-viewport" aria-label="PDF page">
    @if (loading) {
      <p class="message" role="status">Loading PDF…</p>
    } @else if (errorMessage) {
      <p class="message error" role="alert">{{ errorMessage }}</p>
    } @else {
      <canvas #pdfCanvas aria-label="Current PDF page"></canvas>
    }
  </section>
</main>
