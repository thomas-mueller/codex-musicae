<main #viewerRoot class="slides-viewer" [class.presentation-mode]="true">
<app-pdf-canvas-stage [controlsVisibleInitially]="false" [presentationMode]="true" (exitPresentation)="backToEditor()" (escapeWhileHidden)="backToEditor()" (navigate)="handleNavigation($event)">
  <div stage-content #pdfContainer class="pdf-container">
    <canvas #pdfCanvas></canvas>
    @if (loading) {
      <p class="message" role="status">Loading PDF…</p>
    } @else if (errorMessage) {
      <p class="message error" role="alert">{{ errorMessage }}</p>
    }
    @if (!loading && !errorMessage && !slideGroups.length) {
      <p class="message">No slides could be generated from the detected music systems.</p>
    }
  </div>
  <nav stage-controls class="toolbar" aria-label="Slide controls">
    <button type="button" (click)="previousSlide()" [disabled]="!canGoPrevious" aria-label="Previous slide" title="Previous slide"><app-icon name="arrow-left" /></button>
    <span aria-live="polite">Slide {{ slideGroups.length ? currentSlide + 1 : '—' }} of {{ slideGroups.length || '—' }}</span>
    <button type="button" (click)="nextSlide()" [disabled]="!canGoNext" aria-label="Next slide" title="Next slide"><app-icon name="arrow-right" /></button>
    <button type="button" (click)="backToEditor()" aria-label="Open editor" title="Open editor"><app-icon name="edit" /></button>
    <button type="button" (click)="pdfFileInput.click()" aria-label="Open PDF" title="Open PDF"><app-icon name="file-open" /></button>
    <input #pdfFileInput hidden type="file" accept="application/pdf,.pdf" (change)="openFile($any($event.target).files?.[0]); $any($event.target).value = ''" />
    <button type="button" (click)="openExternally()" aria-label="Open PDF externally" title="Open PDF externally"><app-icon name="external-link" /></button>
  </nav>
</app-pdf-canvas-stage>
</main>
