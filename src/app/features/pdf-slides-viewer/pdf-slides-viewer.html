<main #viewerRoot class="slides-viewer" [class.presentation-mode]="true">
<app-pdf-canvas-stage [controlsVisibleInitially]="false" [presentationMode]="true" (exitPresentation)="backToEditor()" (escapeWhileHidden)="backToEditor()" (navigate)="handleNavigation($event)">
  <div stage-content #pdfContainer class="pdf-container">
    <canvas #pdfCanvas></canvas>
    @if (loading) {
      <p class="message" role="status">Loading PDF…</p>
    } @else if (errorMessage) {
      <p class="message error" role="alert">{{ errorMessage }}</p>
    }
  </div>
  <header stage-top-controls class="toolbar top-toolbar" aria-label="Slide top controls">
    <div class="toolbar-section start">
      <button type="button" (click)="pdfFileInput.click()" aria-label="Open PDF" title="Open PDF">
        <app-icon name="file-open" />
      </button>
      <button
        type="button"
        (click)="savePdf()"
        [disabled]="!canSave"
        [attr.aria-label]="saveStatus() === 'saved' ? 'Saved' : 'Save PDF'"
        [attr.title]="saveStatus() === 'saved' ? 'Settings saved inside PDF' : 'Save settings inside PDF'"
      >
        <app-icon [name]="saveStatus() === 'saved' ? 'check' : 'save'" />
      </button>
      <input
        #pdfFileInput
        hidden
        type="file"
        accept="application/pdf,.pdf"
        (change)="openFile($any($event.target).files?.[0]); $any($event.target).value = ''"
      />
    </div>

    <div class="toolbar-section center">
      <div class="zoom-controls" role="group" aria-label="Aspect ratio controls">
        <button type="button" (click)="zoomOut()" [disabled]="!canZoomOut" aria-label="Show more systems" title="Show more systems">
          <app-icon name="zoom-out" />
        </button>
        <span class="zoom-label" [attr.title]="'Aspect ratio: ' + selectedAspectRatioLabel" aria-live="polite">
          {{ selectedAspectRatioLabel }}
        </span>
        <button type="button" (click)="zoomIn()" [disabled]="!canZoomIn" aria-label="Show fewer systems" title="Show fewer systems">
          <app-icon name="zoom-in" />
        </button>
      </div>
    </div>

    <div class="toolbar-section end"></div>
  </header>

  <footer stage-bottom-controls class="toolbar bottom-toolbar" aria-label="Slide bottom controls">
    <div class="toolbar-section start"></div>

    <div class="toolbar-section center">
      <div class="page-controls">
        <button type="button" (click)="previousSlide()" [disabled]="!canGoPrevious" aria-label="Previous slide" title="Previous slide">
          <app-icon name="arrow-left" />
        </button>
        <span [attr.title]="'Slide ' + (slideGroups.length ? currentSlide + 1 : '—') + ' of ' + (slideGroups.length || '—')" aria-live="polite">
          {{ slideGroups.length ? currentSlide + 1 : '—' }} of {{ slideGroups.length || '—' }}
        </span>
        <button type="button" (click)="nextSlide()" [disabled]="!canGoNext" aria-label="Next slide" title="Next slide">
          <app-icon name="arrow-right" />
        </button>
      </div>
    </div>

    <div class="toolbar-section end">
      <button type="button" (click)="backToEditor()" aria-label="Open editor" title="Open editor">
        <app-icon name="edit" />
      </button>
    </div>
  </footer>
</app-pdf-canvas-stage>
</main>
