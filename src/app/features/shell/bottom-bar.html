<button appIconButton icon="previous" labelKey="previous" [disabled]="noDocument()"></button>
@if (compact()) {
  <button
    type="button"
    class="indicator"
    data-popup-trigger
    [class.disabled]="noDocument()"
    [attr.aria-label]="'a11y.' + indicatorKey() | transloco"
    [attr.aria-disabled]="noDocument() ? true : null"
    [attr.tabindex]="noDocument() ? -1 : null"
    (click)="noDocument() || store.togglePopup(sliderId)"
  ></button>
} @else {
  <input
    type="range"
    class="slider"
    [disabled]="noDocument()"
    [attr.aria-label]="'a11y.' + sliderKey() | transloco"
  />
  <span role="status" class="indicator fixed" [class.disabled]="noDocument()" [attr.aria-label]="'a11y.' + indicatorKey() | transloco"></span>
}
<button appIconButton icon="next" labelKey="next" [disabled]="noDocument()"></button>
<button appIconButton icon="zoomOut" labelKey="zoomOut" [disabled]="noDocument()"></button>
<button appIconButton icon="zoomIn" labelKey="zoomIn" [disabled]="noDocument()"></button>
<button appIconButton icon="zoomReset" labelKey="zoomReset" [disabled]="noDocument()"></button>
@if (annotation() && !compact()) {
  <button appIconButton icon="showMore" labelKey="showMore" [disabled]="noDocument()"></button>
  <button appIconButton icon="showLess" labelKey="showLess" [disabled]="noDocument()"></button>
}
@if (compact()) {
  <button
    appIconButton
    data-popup-trigger
    icon="overflow"
    labelKey="overflow"
    [toggled]="store.popup()?.id === overflowId"
    (pressed)="store.togglePopup(overflowId)"
  ></button>
}
