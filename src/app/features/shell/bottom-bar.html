@if (progressText() !== '') {
  <span role="status" class="progress" data-testid="detection-progress" [attr.aria-label]="'a11y.processing' | transloco">
    <app-icon name="processing" />
    <span [textContent]="progressText()"></span>
  </span>
}
<button appIconButton icon="previous" labelKey="previous" [disabled]="previousDisabled()" (pressed)="onPrevious()"></button>
@if (compact()) {
  <button
    type="button"
    class="indicator"
    data-popup-trigger
    [class.disabled]="sliderDisabled()"
    [class.has-text]="indicatorText() !== ''"
    [attr.aria-label]="'a11y.' + indicatorKey() | transloco"
    [attr.aria-disabled]="sliderDisabled() ? true : null"
    [attr.tabindex]="sliderDisabled() ? -1 : null"
    [textContent]="indicatorText()"
    (click)="sliderDisabled() || store.togglePopup(sliderId)"
  ></button>
} @else {
  <input
    type="range"
    class="slider"
    min="1"
    [max]="sliderMax()"
    [value]="sliderValue()"
    [disabled]="sliderDisabled()"
    [attr.aria-label]="'a11y.' + sliderKey() | transloco"
    (input)="onSlide($event)"
  />
  <span
    role="status"
    class="indicator fixed"
    [class.disabled]="sliderDisabled()"
    [class.has-text]="indicatorText() !== ''"
    [attr.aria-label]="'a11y.' + indicatorKey() | transloco"
    [textContent]="indicatorText()"
  ></span>
}
<button appIconButton icon="next" labelKey="next" [disabled]="nextDisabled()" (pressed)="onNext()"></button>
<button appIconButton icon="zoomOut" labelKey="zoomOut" [disabled]="zoomOutDisabled()" (pressed)="view.zoomOut()"></button>
<button appIconButton icon="zoomIn" labelKey="zoomIn" [disabled]="zoomInDisabled()" (pressed)="view.zoomIn()"></button>
<button appIconButton icon="zoomReset" labelKey="zoomReset" [disabled]="zoomResetDisabled()" (pressed)="view.zoomReset()"></button>
@if (annotation() && !compact()) {
  <button appIconButton icon="showMore" labelKey="showMore" [disabled]="showMoreDisabled()" (pressed)="aspect.showMore()"></button>
  <button appIconButton icon="showLess" labelKey="showLess" [disabled]="showLessDisabled()" (pressed)="aspect.showLess()"></button>
}
@if (compact()) {
  <button
    appIconButton
    data-popup-trigger
    icon="overflow"
    labelKey="overflow"
    [toggled]="store.popup()?.id === overflowId"
    (pressed)="store.togglePopup(overflowId)"
  ></button>
}
