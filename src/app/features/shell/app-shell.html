<header class="bar" data-area="top" [hidden]="presentation()">
  @if (!presentation()) {
    <app-top-bar />
  }
</header>
<div class="middle">
  @if (settings()) {
    <app-settings-view data-area="settings" />
  } @else {
    @if (!presentation()) {
      <app-tool-area />
    }
    <app-canvas-area data-area="canvas" />
  }
</div>
<footer class="bar" data-area="bottom" [hidden]="presentation() || settings()">
  @if (!presentation() && !settings()) {
    <app-bottom-bar />
  }
</footer>
<app-popup-host />
<app-level-confirm />
<app-reset-confirm />
