<header class="bar" data-area="top" [hidden]="presentation()">
  @if (!presentation()) {
    <app-top-bar />
  }
</header>
<div class="middle">
  @if (!presentation()) {
    <app-tool-area />
  }
  <app-canvas-area data-area="canvas" />
</div>
<footer class="bar" data-area="bottom" [hidden]="presentation()">
  @if (!presentation()) {
    <app-bottom-bar />
  }
</footer>
<app-popup-host />
<app-level-confirm />
