<div class="content">
  @for (group of groups(); track group.id) {
    <section [attr.data-group]="group.id" [attr.aria-labelledby]="'settings-group-' + group.id">
      <h2 [id]="'settings-group-' + group.id">{{ 'settings.groups.' + group.id | transloco }}</h2>
      @for (setting of group.settings; track setting.definition.id) {
        @let definition = setting.definition;
        <label [attr.data-setting]="definition.id">
          <span>{{ definition.labelKey | transloco }}</span>
          @switch (definition.type) {
            @case ('boolean') {
              <input type="checkbox" [checked]="setting.value() === true" [disabled]="!setting.enabled" (change)="onToggle(setting, $event)" />
            }
            @case ('choice') {
              <select [disabled]="!setting.enabled" (change)="onChoose(setting, $event)">
                @for (option of definition.options; track option.value) {
                  <option [value]="option.value" [selected]="setting.value() === option.value">{{ option.labelKey | transloco }}</option>
                }
              </select>
            }
            @case ('seconds') {
              <input
                type="number"
                [min]="definition.min"
                [max]="definition.max"
                [step]="definition.step"
                [value]="setting.value()"
                [disabled]="!setting.enabled"
                (change)="onSeconds(setting, $event)"
              />
            }
          }
        </label>
      }
      @if (group.id === 'general') {
        <!-- UIX-023: an action, not a setting; it stays below whatever is registered here -->
        <button type="button" class="reset" appTooltip="resetSettings" [attr.aria-label]="'a11y.resetSettings' | transloco" (click)="ui.requestReset()">
          <app-icon name="resetSettings" />
          <span>{{ 'settings.reset.button' | transloco }}</span>
        </button>
      }
    </section>
  }
  <p class="version" role="note" [attr.aria-label]="'a11y.versionInfo' | transloco" [textContent]="version"></p>
</div>
