<main class="pdf-editor">
  <app-pdf-canvas-stage [controlsVisibleInitially]="true" (navigate)="handleNavigation($event)">
    <header stage-top-controls class="toolbar top-toolbar" aria-label="PDF top controls">
      <div class="toolbar-section start">
        <button type="button" (click)="pdfFileInput.click()" aria-label="Open PDF" title="Open PDF">
          <app-icon name="file-open" />
        </button>
        <input
          #pdfFileInput
          hidden
          type="file"
          accept="application/pdf,.pdf"
          (change)="openFile($any($event.target).files?.[0]); $any($event.target).value = ''"
        />
      </div>

      <div class="toolbar-section center">
        <div class="zoom-controls">
          <button type="button" (click)="zoomOut()" [disabled]="zoom <= 0.5" aria-label="Zoom out" title="Zoom out">
            <app-icon name="zoom-out" />
          </button>
          <span class="zoom-label">{{ (zoom * 100) | number: '1.0-0' }}%</span>
          <button type="button" (click)="zoomIn()" [disabled]="zoom >= 3" aria-label="Zoom in" title="Zoom in">
            <app-icon name="zoom-in" />
          </button>
        </div>
        <label class="padding-control">Padding
          <input
            type="number"
            min="0"
            max="0.5"
            step="0.005"
            [value]="padding()"
            (input)="setPadding($any($event.target).value)"
          />
        </label>
      </div>

      <div class="toolbar-section end"></div>
    </header>

    <footer stage-bottom-controls class="toolbar bottom-toolbar" aria-label="PDF bottom controls">
      <div class="toolbar-section start"></div>

      <div class="toolbar-section center">
        <div class="page-controls">
          <button
            type="button"
            (click)="previousPage()"
            [disabled]="!canGoToPreviousPage"
            aria-label="Previous page"
            title="Previous page"
          >
            <app-icon name="arrow-left" />
          </button>
          <span [attr.title]="'Page ' + currentPage + ' of ' + (pageCount || '—')" aria-live="polite">
            {{ currentPage }} of {{ pageCount || '—' }}
          </span>
          <button
            type="button"
            (click)="nextPage()"
            [disabled]="!canGoToNextPage"
            aria-label="Next page"
            title="Next page"
          >
            <app-icon name="arrow-right" />
          </button>
        </div>
      </div>

      <div class="toolbar-section end">
        <button
          type="button"
          class="slides-button"
          (click)="navigateToViewer()"
          aria-label="Open slides viewer"
          title="Open slides viewer"
        >
          <app-icon name="presentation" />
        </button>
      </div>
    </footer>

    <section stage-content #pdfViewport class="pdf-viewport" aria-label="PDF page">
    @if (loading) {
      <p class="message" role="status">Loading PDF…</p>
    } @else if (errorMessage) {
      <p class="message error" role="alert">{{ errorMessage }}</p>
    } @else {
      <canvas #pdfCanvas aria-label="Current PDF page"></canvas>
    }
    </section>
  </app-pdf-canvas-stage>
</main>
